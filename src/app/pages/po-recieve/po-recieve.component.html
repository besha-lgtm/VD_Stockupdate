<div class="dashboard-layout">

    <!-- Header -->
    <app-header></app-header>

    <!-- Body -->
    <div class="dashboard-body">

        <!-- Sidebar -->
        <app-sidebar></app-sidebar>

        <!-- Main Content -->
        <main class="dashboard-content">

            <div class="table-container">

                <div class="table-header">
                    <h2>PO Receiving</h2>
                </div>

                <div class="table-scroll">

                <table>

                    <thead>

                        <tr>
                            <th>S.No</th>
                            <th>PO Number</th>
                            <th>Item Description</th>
                            <th>Ordered Qty</th>
                            <th>Received Qty</th>
                            <th>Unit</th>
                            <th>Receipt No</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr *ngFor="let item of receivingData; let i = index">

                            <td>{{ i + 1 }}</td>
                            <td>{{ item.poNumber }}</td>
                            <td>{{ item.description }}</td>
                            <td>{{ item.orderedQty }}</td>
                            <td>{{ item.receivedQty }}</td>
                            <td>{{ item.unit }}</td>
                            <td>{{ item.receipt }}</td>

                            <td>
                                <span
                                    class="status"
                                    [class.status-received]="item.status === 'RECEIVED'">
                                    {{ item.status }}
                                </span>
                            </td>

                        </tr>

                    </tbody>

                </table>

                </div>

            </div>

        </main>

    </div>

</div>
