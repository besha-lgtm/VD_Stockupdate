<header class="app-header">

    <div class="app-header-logo-section">

        <div class="app-header-logo">

            <img
                *ngIf="!logoLoadFailed"
                src="/assets/logo.jpg"
                alt="Logo"
                (error)="onLogoError()">

            <span class="app-header-logo-fallback" *ngIf="logoLoadFailed">SW</span>

        </div>

        <div class="app-header-company">

            <h2>Smart WMS</h2>
            <span class="app-header-highlight">Warehouse Management System</span>

        </div>

    </div>

    <div class="app-header-right">

        <div class="app-header-notification">
        </div>

        <div class="app-header-user">

            <div class="app-header-avatar">
                J
            </div>

            <div class="app-header-user-info">

                <h4>Joel</h4>
                <span>Warehouse Admin</span>

            </div>

        </div>

    </div>

</header>
