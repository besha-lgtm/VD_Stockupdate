<header class="header">

    <div class="logo-section">

        <div class="logo">

            <img
                *ngIf="!logoLoadFailed"
                src="assets/logo.jpg"
                alt="Logo"
                (error)="onLogoError()">

            <span class="logo-fallback" *ngIf="logoLoadFailed">SW</span>

        </div>

        <div class="company">

            <h2>Smart WMS</h2>
            <span>Warehouse Management System</span>

        </div>

    </div>

    <div class="header-right">

        <div class="notification">
        </div>

        <div class="user">

            <div class="avatar">
                J
            </div>

            <div class="user-info">

                <h4>Joel</h4>
                <span>Warehouse Admin</span>

            </div>

        </div>

       <button class="logout-btn" (click)="logout()">

    Logout
</button>

    </div>

</header>
